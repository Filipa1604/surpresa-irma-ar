<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uma surpresa para ti ❤️</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18121d;color:white;font-family:Arial,sans-serif}
    #overlay{position:fixed;inset:0;z-index:1000;background:rgba(15,10,20,.93);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;box-sizing:border-box}
    #start{font-size:19px;padding:17px 24px;border:0;border-radius:30px;background:#ffcedd;color:#42132b;font-weight:bold}
    #hint{margin-top:18px;line-height:1.5;max-width:340px}
    #status{position:fixed;bottom:22px;left:10px;right:10px;text-align:center;z-index:500;text-shadow:0 2px 5px black;pointer-events:none;font-size:15px}
    .a-enter-vr,.a-enter-ar{display:none!important}
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start">❤️ Toca aqui para dar vida à fotografia</button>
    <p id="hint">Depois, permite o acesso à câmara e aponta o telemóvel para a fotografia.</p>
  </div>
  <div id="status">A aguardar…</div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    <a-assets timeout="120000">
      <video id="surprise-video" src="./video.mp4" preload="metadata" loop="false" playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="screen" src="#surprise-video" width="1" height="0.5625" position="0 0 0.01"></a-video>
    </a-entity>
  </a-scene>
  <script>
    const start = document.getElementById('start');
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    const video = document.getElementById('surprise-video');
    const scene = document.querySelector('a-scene');
    const target = document.getElementById('target');
    let recognized = false;
    let started = false;
    let finished = false;

    video.addEventListener('ended', () => { finished = true; status.textContent = '❤️ Fim da surpresa'; });
    video.addEventListener('error', () => { status.textContent = 'Não foi possível carregar o vídeo. Verifica video.mp4.'; });
    target.addEventListener('targetFound', async () => {
      recognized = true;
      status.textContent = '❤️ Fotografia reconhecida!';
      if (started && !finished) {
        try { await video.play(); status.textContent = ''; }
        catch (e) { status.textContent = 'Toca no ecrã para iniciar o vídeo com som.'; }
      }
    });
    target.addEventListener('targetLost', () => {
      recognized = false;
      video.pause();
      if (!finished) status.textContent = 'Aponta a câmara para a fotografia ❤️';
    });
    document.addEventListener('click', async () => {
      if (started && recognized && video.paused && !finished) {
        try { await video.play(); status.textContent = ''; } catch (e) { status.textContent = 'Não foi possível iniciar o vídeo.'; }
      }
    });
    start.addEventListener('click', async () => {
      start.disabled = true;
      start.textContent = 'A iniciar a câmara…';
      try {
        await scene.systems['mindar-image-system'].start();
        started = true;
        overlay.style.display = 'none';
        status.textContent = 'Aponta a câmara para a fotografia ❤️';
      } catch (e) {
        start.disabled = false;
        start.textContent = '❤️ Tentar novamente';
        document.getElementById('hint').textContent = 'Não foi possível iniciar a câmara. Confirma a permissão e volta a tentar.';
      }
    });
  </script>
</body>
</html>
